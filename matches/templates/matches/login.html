{% extends "matches/base.html" %}
{% block title %}Logowanie — MATCH50{% endblock %}
{% block content %}
<style>.login{max-width:440px;margin:8vh auto;padding:30px}.login h1{margin:0;font-size:36px;letter-spacing:-.06em}.login p{color:var(--muted)}.login p label{display:block;margin:18px 0 6px;font-weight:800}.login p input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;font:inherit}.login .errorlist{padding:0;color:#a83232;list-style:none;font-weight:700}</style>
<section class="login card"><h1>Logowanie</h1><p>Zaloguj się, aby zapisywać typy.</p><form method="post">{% csrf_token %}{{ form.as_p }}<button class="button lime" type="submit">ZALOGUJ SIĘ</button></form></section>
{% endblock %}
