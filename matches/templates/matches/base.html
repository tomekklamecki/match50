<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}MATCH50{% endblock %}</title><style>:root{--navy:#0d1b3f;--lime:#c8f24a;--ink:#14213d;--muted:#62708a;--line:#e5eaf2;--canvas:#f5f7fb}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:15px/1.45 Arial,sans-serif}.shell{width:min(1180px,100%);margin:auto;padding:18px}.topbar{display:flex;gap:18px;align-items:center;justify-content:space-between;padding:4px 0 18px}.brand{color:var(--navy);text-decoration:none;font-size:24px;font-weight:900}.brand b{color:#78a900}.nav{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}.nav a{color:var(--navy);font-size:12px;font-weight:800;text-decoration:none}.account{padding-left:12px;border-left:1px solid var(--line)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 28px rgba(20,33,61,.06)}.button{display:inline-block;padding:12px 16px;border:0;border-radius:10px;background:var(--navy);color:#fff;cursor:pointer;font:inherit;font-weight:800;text-decoration:none}.button.lime{background:var(--lime);color:var(--navy)}.button.secondary{background:#edf1f7;color:var(--navy)}@media(max-width:700px){.topbar{align-items:flex-start;flex-direction:column}}</style></head><body><div class="shell"><header class="topbar"><a class="brand" href="{% url 'home' %}">MATCH<b>50</b></a><nav class="nav"><a href="{% url 'home' %}">HOME</a><a href="{% url 'typy' %}">TYPY</a><a href="{% url 'draft' %}">DRAFT</a><a href="{% url 'rankings' %}">RANKINGS</a><a href="{% url 'stats' %}">STATS</a><a href="{% url 'rules' %}">RULES</a><span class="account">{% if user.is_authenticated %}<a href="{% url 'player_profile' user.username %}">{{ user.username }}</a> · <form style="display:inline" method="post" action="{% url 'logout' %}">{% csrf_token %}<button style="border:0;background:none;color:var(--navy);font-weight:800;cursor:pointer">WYLOGUJ</button></form>{% else %}<a href="{% url 'login' %}">ZALOGUJ</a>{% endif %}</span></nav></header>{% if messages %}<ul class="messages">{% for message in messages %}<li>{{ message }}</li>{% endfor %}</ul>{% endif %}{% block content %}{% endblock %}</div></body></html>
