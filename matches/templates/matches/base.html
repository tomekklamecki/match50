<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MATCH50{% endblock %}</title>
  <style>
    :root{--navy:#0d1b3f;--lime:#c8f24a;--ink:#14213d;--muted:#62708a;--line:#e5eaf2;--canvas:#f5f7fb}
    *{box-sizing:border-box} body{margin:0;background:var(--canvas);color:var(--ink);font:15px/1.45 Arial,sans-serif}
    .shell{width:min(1180px,100%);margin:auto;padding:18px}.topbar{display:flex;gap:18px;align-items:center;justify-content:space-between;padding:4px 0 18px}
    .brand{color:var(--navy);text-decoration:none;font-size:24px;font-weight:900}.brand b{color:#78a900}
    .nav{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}.nav a{color:var(--navy);font-size:12px;font-weight:800;text-decoration:none}.nav > a[aria-current="page"]{padding:7px 9px;margin:-7px -9px;border-radius:7px;background:#eff5d9;color:#406000;box-shadow:inset 0 -3px #86b329}.account{padding-left:12px;border-left:1px solid var(--line)}.nav-toggle{display:none}
    .card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 28px rgba(20,33,61,.06)}.button{display:inline-block;padding:12px 16px;border:0;border-radius:10px;background:var(--navy);color:#fff;cursor:pointer;font:inherit;font-weight:800;text-decoration:none}.button.lime{background:var(--lime);color:var(--navy)}.button.secondary{background:#edf1f7;color:var(--navy)}
    @media(max-width:700px){
      .shell{padding:14px}.topbar{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:4px 0 16px}
      .nav-toggle{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 11px;border:1px solid rgba(13,27,63,.14);border-radius:9px;background:var(--navy);color:var(--lime);cursor:pointer;font:800 10px/1 Arial,sans-serif;letter-spacing:.12em}
      .nav-toggle i,.nav-toggle i::before,.nav-toggle i::after{display:block;width:15px;height:1.5px;border-radius:2px;background:currentColor;content:"";transition:transform .18s ease,opacity .18s ease}.nav-toggle i{position:relative}.nav-toggle i::before,.nav-toggle i::after{position:absolute;left:0}.nav-toggle i::before{top:-5px}.nav-toggle i::after{top:5px}.nav-toggle[aria-expanded="true"] i{background:transparent}.nav-toggle[aria-expanded="true"] i::before{transform:translateY(5px) rotate(45deg)}.nav-toggle[aria-expanded="true"] i::after{transform:translateY(-5px) rotate(-45deg)}
      .nav{display:none;grid-column:1/-1;flex-direction:column;align-items:stretch;gap:3px;width:100%;padding:8px;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:0 12px 26px rgba(20,33,61,.09)}.nav[data-open="true"]{display:flex;animation:nav-reveal .16s ease-out}.nav a,.nav > a[aria-current="page"]{padding:10px 11px;margin:0;border-radius:7px;font-size:11px;letter-spacing:.06em}.nav > a[aria-current="page"],.nav a:hover,.nav a:focus-visible{background:#eff5d9;color:#406000;outline:none}.account{display:flex;align-items:center;gap:5px;padding:10px 11px 3px;border-top:1px solid var(--line);border-left:0}
      @keyframes nav-reveal{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
    }
    @media(prefers-reduced-motion:reduce){.nav[data-open="true"]{animation:none}.nav-toggle i,.nav-toggle i::before,.nav-toggle i::after{transition:none}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="{% url 'home' %}">MATCH<b>50</b></a>
      <button class="nav-toggle" type="button" aria-controls="main-navigation" aria-expanded="false"><span>MENU</span><i aria-hidden="true"></i></button>
      <nav id="main-navigation" class="nav" data-open="false">
        <a href="{% url 'home' %}">HOME</a><a href="{% url 'typy' %}">TYPY</a><a href="{% url 'draft' %}">DRAFT</a><a href="{% url 'rankings' %}">RANKINGS</a><a href="{% url 'stats' %}">STATS</a><a href="{% url 'rules' %}">RULES</a>
        <span class="account">{% if user.is_authenticated %}<a href="{% url 'player_profile' user.username %}">{{ user.username }}</a> · <form style="display:inline" method="post" action="{% url 'logout' %}">{% csrf_token %}<button style="border:0;background:none;color:var(--navy);font-weight:800;cursor:pointer">WYLOGUJ</button></form>{% else %}<a href="{% url 'login' %}">ZALOGUJ</a>{% endif %}</span>
      </nav>
    </header>
    {% if messages %}<ul class="messages">{% for message in messages %}<li>{{ message }}</li>{% endfor %}</ul>{% endif %}
    {% block content %}{% endblock %}
  </div>
  <script>
    (() => {
      const toggle = document.querySelector('.nav-toggle');
      const nav = document.querySelector('#main-navigation');
      if (!toggle || !nav) return;
      nav.querySelectorAll(':scope > a').forEach((link) => {
        if (new URL(link.href).pathname === window.location.pathname) link.setAttribute('aria-current', 'page');
      });
      const close = () => { nav.dataset.open = 'false'; toggle.setAttribute('aria-expanded', 'false'); };
      toggle.addEventListener('click', () => { const open = nav.dataset.open !== 'true'; nav.dataset.open = String(open); toggle.setAttribute('aria-expanded', String(open)); });
      nav.addEventListener('click', (event) => { if (event.target.closest('a')) close(); });
      document.addEventListener('keydown', (event) => { if (event.key === 'Escape' && nav.dataset.open === 'true') { close(); toggle.focus(); } });
    })();
  </script>
</body>
</html>
